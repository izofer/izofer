<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="600" height="170" fill="none">
  <defs>
    <linearGradient id="izoNeon" x1="0" y1="0" x2="600" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#ff2a4d"/>
    </linearGradient>
    <linearGradient id="izoWord" x1="120" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
    <filter id="izoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g font-family="'JetBrains Mono','Fira Code','Consolas','Courier New',monospace"
     font-weight="800" font-size="104" letter-spacing="2" filter="url(#izoGlow)">
    <!-- opening tag -->
    <text x="20" y="120" fill="url(#izoNeon)">&lt;</text>
    <!-- wordmark -->
    <text x="118" y="120" fill="url(#izoWord)">IZOFER</text>
    <!-- self-closing tag -->
    <text x="470" y="120" fill="url(#izoNeon)">/&gt;</text>
  </g>

  <!-- blinking cursor block -->
  <rect x="442" y="44" width="20" height="78" rx="2" fill="url(#izoNeon)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
