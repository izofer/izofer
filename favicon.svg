<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fvNeon" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#ff2a4d"/>
    </linearGradient>
    <filter id="fvGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b0d14"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#fvNeon)" stroke-width="2.5" opacity="0.9"/>

  <!-- code symbol  </>  -->
  <g stroke="url(#fvNeon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#fvGlow)">
    <path d="M24 22 L13 32 L24 42"/>
    <path d="M40 22 L51 32 L40 42"/>
    <path d="M36 18 L28 46"/>
  </g>
</svg>
